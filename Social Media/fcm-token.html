<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FCM Token Generator</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --border: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #3b82f6;
        --ok: #22c55e;
        --err: #ef4444;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 16px;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }
      .wrap {
        max-width: 640px;
        margin: 0 auto;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 16px;
      }
      .card h2 {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 12px;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input,
      textarea {
        width: 100%;
        padding: 10px 12px;
        background: #0b1220;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 13px;
        margin-bottom: 12px;
      }
      textarea {
        resize: vertical;
        min-height: 96px;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        margin-right: 8px;
      }
      button:hover {
        filter: brightness(1.1);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.secondary {
        background: #475569;
      }
      .log {
        background: #0b1220;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        max-height: 260px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .log div {
        margin-bottom: 4px;
      }
      .ok {
        color: var(--ok);
      }
      .err {
        color: var(--err);
      }
      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>🔔 FCM Token Generator</h1>
      <p class="sub">
        Pure client-side — no backend involved. Paste a VAPID key, click Get
        Token, copy the result and hand it to whoever needs it server-side.
      </p>

      <div class="card">
        <h2>VAPID public key</h2>
        <input
          id="vapid"
          value="BDd51yH0yraq3Tg5wHoGmpTk8uFJ9LBadSKZRv6k7QvZZTYbV44b2HMp4qs4nO-gNhgWfSUoMk-YsNxYNHxHILs"
        />
        <button id="btnToken">Get FCM Token</button>
      </div>

      <div class="card">
        <h2>Token</h2>
        <textarea
          id="token"
          readonly
          placeholder="Token appears here…"
        ></textarea>
        <button id="btnCopy" class="secondary" disabled>Copy</button>
      </div>

      <div class="card">
        <h2>Log</h2>
        <div class="log" id="log">
          <div class="muted">Waiting…</div>
        </div>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getMessaging,
        getToken,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

      // public identifiers — safe in client code
      const firebaseConfig = {
   apiKey: "AIzaSyAeTHtdegOxEO_T4avF0Hjf1a9pXsoOguk",
  authDomain: "social-media-c31b9.firebaseapp.com",
  projectId: "social-media-c31b9",
  storageBucket: "social-media-c31b9.firebasestorage.app",
  messagingSenderId: "826170862253",
  appId: "1:826170862253:web:f162af54e07c49a528f424",
  measurementId: "G-BWEXVKH01Q"
};

      const app = initializeApp(firebaseConfig);
      const messaging = getMessaging(app);

      const $ = (id) => document.getElementById(id);
      const logEl = $("log");
      const log = (msg, cls = "") => {
        const time = new Date().toLocaleTimeString();
        logEl.insertAdjacentHTML(
          "afterbegin",
          `<div class="${cls}">[${time}] ${msg}</div>`,
        );
      };
      logEl.innerHTML = "";
      log("Ready. Paste your VAPID key and click Get FCM Token.", "muted");

      $("vapid").value = localStorage.getItem("vapidKey") || $("vapid").value;
      let currentToken = "";

      $("btnToken").onclick = async () => {
        const vapidKey = $("vapid").value.trim();
        if (!vapidKey) return log("VAPID key is required", "err");
        localStorage.setItem("vapidKey", vapidKey);

        try {
          log("Requesting notification permission…");
          const permission = await Notification.requestPermission();
          if (permission !== "granted") {
            return log(`Permission ${permission} — cannot get a token`, "err");
          }
          log("Permission granted", "ok");

          log("Registering service worker…");
          const registration = await navigator.serviceWorker.register(
            "/firebase-messaging-sw.js",
          );
          log("Service worker registered", "ok");

          log("Requesting FCM token…");
          currentToken = await getToken(messaging, {
            vapidKey,
            serviceWorkerRegistration: registration,
          });

          if (!currentToken) return log("No token returned", "err");

          $("token").value = currentToken;
          $("btnCopy").disabled = false;
          log(`Token received (${currentToken.length} chars)`, "ok");
        } catch (error) {
          log(`Error: ${error.message}`, "err");
        }
      };

      $("btnCopy").onclick = async () => {
        await navigator.clipboard.writeText(currentToken);
        log("Token copied to clipboard", "ok");
      };
    </script>
  </body>
</html>
